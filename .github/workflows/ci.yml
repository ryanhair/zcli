name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least-privilege default: every job here checks out, builds, and tests — none
# needs to write anything. The `changes` job further narrows its own token
# (adds `pull-requests: read` for the paths-filter API call); no other job
# needs elevation above this default.
permissions:
  contents: read

jobs:
  # Classifies the diff so the expensive jobs below only run when paths they
  # actually cover changed. Deliberately job-level `if:` gating (each job
  # declares `needs: changes`) rather than workflow-level `paths:` filtering —
  # a path-filtered workflow never reports its checks, which leaves required
  # status checks pending forever, whereas a skipped job reports "skipped"
  # and satisfies them.
  #
  # Fail-open design, in three layers:
  #   1. Pushes to main always run EVERYTHING — gating applies only to PRs, so
  #      a wrong filter can delay feedback to merge time but can never let
  #      main go unvalidated.
  #   2. The `ci-full` PR label forces the full matrix (escape hatch when a
  #      filter is suspected of lying).
  #   3. Every filter includes this workflow file itself, so a change to the
  #      filters re-runs everything they gate.
  # `fmt` and `version-sync` are not gated: they finish in seconds — about
  # what this job costs — and they are the only checks left on docs-only PRs.
  changes:
    name: classify changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter reads the PR file list via the API
    outputs:
      code: ${{ steps.resolve.outputs.code }}
      cli: ${{ steps.resolve.outputs.cli }}
      secrets: ${{ steps.resolve.outputs.secrets }}
      examples: ${{ steps.resolve.outputs.examples }}
      installers: ${{ steps.resolve.outputs.installers }}
      website: ${{ steps.resolve.outputs.website }}
    steps:
      # Only needed for push events (PR events use the API), but checking out
      # unconditionally keeps the job shape simple.
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Filter vocabulary (the package dependency graph is top-heavy — theme/
      # terminal/vterm/ui sit under nearly everything — so these gates are
      # coarse by design; finer affected-package selection happens later,
      # inside the build, not here):
      #   code:     any Zig source anywhere → the cross-OS unit-test matrix and
      #             the registry comptime-scaling gate (whose generator script
      #             is listed here too, so editing it re-runs the gate).
      #   cli:      anything the zcli binary embeds (all of packages/ + the
      #             CLI itself) → e2e matrix + release-mode builds. Only
      #             examples-only and docs-only PRs miss this.
      #   secrets:  the zcli_secrets plugin + core's step wiring → the 3-OS
      #             live-keychain job, which otherwise ran on every PR for
      #             code that changes rarely.
      #   examples: the canonical examples or anything they compile against.
      #   installers: install.sh / install.ps1 (the curl|sh + irm|iex trust
      #             root) and the release-signing ceremony → the installer
      #             signature/version-binding suite. No Zig involved, so
      #             nothing else in this workflow covers them.
      #   website:  every input sync-site-data.sh reads, plus the Zine sources
      #             themselves → the site build. CHANGELOG.md is in here because
      #             it is a *build input*, not just prose: the script generates
      #             content/changelog/index.smd from it, so a repo-relative
      #             markdown link in a release entry becomes broken site markup.
      #             build.zig.zon supplies the version and
      #             packages/core/src/plugins the plugin count; the script hard
      #             -fails on either being unreadable.
      - name: Classify diff
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            code:
              - 'packages/**'
              - 'projects/**'
              - 'examples/**'
              - 'build.zig'
              - 'build.zig.zon'
              - 'scripts/gen-scale-project.sh'
              - '.github/workflows/ci.yml'
            cli:
              - 'packages/**'
              - 'projects/zcli/**'
              - 'build.zig'
              - 'build.zig.zon'
              - '.github/workflows/ci.yml'
            secrets:
              - 'packages/core/src/plugins/zcli_secrets/**'
              - 'packages/core/build.zig'
              - 'packages/core/build.zig.zon'
              - 'build.zig'
              - 'build.zig.zon'
              - '.github/workflows/ci.yml'
            examples:
              - 'examples/**'
              - 'packages/**'
              - 'build.zig'
              - 'build.zig.zon'
              - '.github/workflows/ci.yml'
            installers:
              - 'install.sh'
              - 'install.ps1'
              - 'scripts/release.sh'
              - 'scripts/test-release-orchestration.sh'
              - 'scripts/test-install-signature.sh'
              - 'scripts/test-install-signature.ps1'
              - '.github/workflows/deploy-docs.yml'
              - '.github/workflows/ci.yml'
            website:
              - 'website/**'
              - 'CHANGELOG.md'
              - 'build.zig.zon'
              - 'packages/core/src/plugins/**'
              - '.github/actions/setup-zine/**'
              - '.github/workflows/ci.yml'

      - name: Resolve gates (full run on main push or the ci-full label)
        id: resolve
        shell: bash
        env:
          FULL: ${{ github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'ci-full') }}
          CODE: ${{ steps.filter.outputs.code }}
          CLI: ${{ steps.filter.outputs.cli }}
          SECRETS: ${{ steps.filter.outputs.secrets }}
          EXAMPLES: ${{ steps.filter.outputs.examples }}
          INSTALLERS: ${{ steps.filter.outputs.installers }}
          WEBSITE: ${{ steps.filter.outputs.website }}
        run: |
          gate() {
            local v=false
            if [ "$FULL" = "true" ] || [ "$2" = "true" ]; then v=true; fi
            echo "$1=$v" >> "$GITHUB_OUTPUT"
            echo "$1: $v"
          }
          gate code "$CODE"
          gate cli "$CLI"
          gate secrets "$SECRETS"
          gate examples "$EXAMPLES"
          gate installers "$INSTALLERS"
          gate website "$WEBSITE"

  fmt:
    name: zig fmt check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      # Explicit paths rather than "." — scripts/ and website/ contain no Zig
      # source, and this keeps cache/output dirs out of scope.
      - name: Check formatting
        run: zig fmt --check packages projects examples build.zig

      # Output-contract invariant: runtime code must route ALL output and
      # process exit through the command context (context.stdout()/stderr()/
      # exit()/fail()), never std.debug.print or std.process.exit. Those bypass
      # the framework's buffered streams — output is silently dropped when the
      # process exits without flushing — and defeat stream overrides.
      #
      # Scope widened beyond plugins (PR #237) to all of packages/core/src plus
      # the CLI's own commands, both non-test. Exempt, with reasons:
      #   - *_test.zig and the two mixed files with in-file test blocks
      #     (options/array_utils.zig, commands/add/_generate.zig): test
      #     diagnostics, not runtime output.
      #   - comment / doc-example / multiline-string ('\\') lines: not code.
      #   - context.zig: THE sanctioned exit — it flushes buffered output first.
      #   - registry/compiled.zig: the CLI entry point's exit(1) after a reported
      #     error, which runs only once executeWithStdio's `defer stdio.flush()`
      #     has fired and the console has been restored.
      #   - build_utils/: runs at build time (*std.Build) — no io, no context,
      #     no buffered stream exists; std.debug.print is the build-time channel.
      - name: No std.debug.print / std.process.exit outside the context (output contract)
        shell: bash
        run: |
          offenders=$(grep -rnE 'std\.debug\.print|std\.process\.exit' \
               --include='*.zig' \
               --exclude='*_test.zig' \
               packages/core/src/ projects/zcli/src/commands/ \
             | grep -vE ':[0-9]+:[[:space:]]*(///?|\\\\)' \
             | grep -vE 'packages/core/src/context\.zig:' \
             | grep -vE 'packages/core/src/registry/compiled\.zig:' \
             | grep -vE 'packages/core/src/build_utils/' \
             | grep -vE 'packages/core/src/options/array_utils\.zig:' \
             | grep -vE 'projects/zcli/src/commands/add/_generate\.zig:' \
             || true)
          if [ -n "$offenders" ]; then
            echo "::error::route output/exit through the command context (context.stdout()/stderr()/exit()/fail()), not std.debug.print/std.process.exit:"
            echo "$offenders"
            exit 1
          fi
          echo "output contract holds: no raw std.debug.print/std.process.exit in runtime code"

      # Shared-offset invariant (ADR-0014, originally P0 #205, regressed and
      # re-fixed in #763): an inherited stdout/stderr/stdin is frequently a
      # *shared* regular-file fd (`cmd >log`, `cmd 2>>build.log`, CI log
      # capture). `File.writer()`/`File.reader()` build a POSITIONAL stream that
      # pwrites/preads from its own offset starting at 0, ignoring the fd's
      # shared offset — so it overwrites a concurrent appender's bytes from the
      # top of the file, or re-reads input the parent already consumed. Only
      # `writerStreaming`/`readerStreaming` (plain write(2)/read(2)) use the
      # kernel's shared offset. See the long comment on `zcli.Stdio.init`.
      #
      # Scope is library/CLI source only — packages/*/src and projects/*/src.
      # `packages/*/examples/` is deliberately out of scope: those are
      # standalone demos that own their own streams, and widening this to them
      # is a separate change.
      - name: No positional writers/readers on inherited stdio (shared-offset contract)
        shell: bash
        run: |
          offenders=$(grep -rnE '\.std(out|err|in)\(\)\.(writer|reader)\(' \
               --include='*.zig' \
               packages/*/src/ projects/*/src/ \
             | grep -vE ':[0-9]+:[[:space:]]*(///?|\\\\)' \
             || true)
          if [ -n "$offenders" ]; then
            echo "::error::use writerStreaming()/readerStreaming() on inherited stdio — .writer()/.reader() are positional and corrupt a shared-fd append (see zcli.Stdio.init):"
            echo "$offenders"
            exit 1
          fi
          echo "shared-offset contract holds: no positional stdio writers/readers in library source"

      # vterm's public API is what every consumer test assertion is written
      # against (`result.term.hasAttribute(...)`), and it sat at 1 of 50
      # declarations documented until #786 — a package README mitigates that but
      # does not replace it. Now that the file is at 100%, this keeps it there:
      # the failure mode being guarded is not "someone documents nothing", it is
      # the slow slide back as declarations get added one at a time.
      #
      # Scoped to this one file deliberately. The repo-wide number (56%) is not a
      # target to enforce — a doc comment written to satisfy a gate is worse than
      # none — so the gate covers only the surface where the value per word is
      # highest and the file is already clean. Widening it means bringing another
      # file to 100% first, on purpose, not padding one to clear a bar.
      #
      # A declaration counts as documented when the nearest preceding non-blank
      # line is a `///` comment, which is exactly what `zig fmt` produces.
      - name: vterm's public API is documented
        shell: bash
        run: |
          file=packages/vterm/src/vterm.zig
          bare=$(awk '
            /^ *pub (fn|const) / { if (prev !~ /^ *\/\/\//) print FILENAME":"NR": "$0 }
            { if ($0 ~ /^[ \t]*$/) next; prev=$0 }
          ' "$file")
          if [ -n "$bare" ]; then
            echo "::error::public declarations in $file must carry a /// doc comment — explain WHY it exists or what it costs, not just what it does:"
            echo "$bare"
            exit 1
          fi
          echo "$file: every public declaration is documented"

  # This intentionally uses no credential: the public ruleset endpoint exposes
  # the rule types and required-check configuration. It exposes
  # `bypass_actors: null` anonymously, so this assertion does not and cannot
  # verify bypass actors; SECURITY.md records that authenticated-admin audit
  # limitation. Unlike path-gated work, this job always runs, and an unreadable
  # API response is a failure rather than a skipped assertion.
  ruleset:
    name: main ruleset shape
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Assert the public Main Protection ruleset shape
        shell: bash
        run: |
          set -euo pipefail
          ruleset=$(
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              'https://api.github.com/repos/ryanhair/zcli/rulesets/18284157'
          ) || {
            echo "::error::cannot read the public Main Protection ruleset; refusing to skip its drift assertion"
            exit 1
          }

          if ! jq -e '
            .id == 18284157
            and .name == "Main Protection"
            and .enforcement == "active"
            and (.conditions.ref_name.exclude == [])
            and (.conditions.ref_name.include | sort == ["~DEFAULT_BRANCH"])
            and ([.rules[].type] | sort == ["deletion", "non_fast_forward", "required_status_checks"])
            and ([.rules[] | select(.type == "required_status_checks") | .parameters] | length == 1)
            and ([.rules[] | select(.type == "required_status_checks") | .parameters][0].strict_required_status_checks_policy == false)
            and ([.rules[] | select(.type == "required_status_checks") | .parameters][0].required_status_checks | map(.context) | sort == ["CI OK"])
          ' <<<"$ruleset"; then
            echo "::error::public Main Protection ruleset shape drifted (expected default-branch deletion, non_fast_forward, and non-strict CI OK)"
            exit 1
          fi

          echo "public Main Protection ruleset shape holds; bypass actors require authenticated administrative audit"

  # The checked-in validator is the one policy implementation shared with the
  # release workflow and post-release smoke verification. It checks all three
  # umbrella manifests, README, ROADMAP, changelog release metadata, and the
  # version reported by an actual built CLI. Keeping that logic out of YAML
  # prevents the pre-merge and release gates from quietly diverging.
  version-sync:
    name: version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Test version validation policy
        run: sh scripts/test-validate-version.sh

      - name: Build zcli for version validation
        working-directory: projects/zcli
        run: zig build

      - name: Validate release versions and built CLI
        run: scripts/validate-version.sh --cli projects/zcli/zig-out/bin/zcli

      # The website's getting-started page shows a demo `install` transcript with
      # release-version lines ("Fetching latest release… zcli vX.Y.Z" and a
      # `zcli --version` line). Those versions are injected at build time from
      # assets/site-data.json, which sync-site-data.sh regenerates from the root
      # build.zig.zon before every zine build (locally via build.zig, in deploy
      # via deploy-docs.yml) — so they can't drift. What CAN regress is someone
      # hardcoding a version back into the transcript, so forbid that form and
      # require the injection to still be present.
      - name: Website transcript injects the release version (no hardcoded zcli versions)
        shell: bash
        run: |
          gs=website/layouts/getting-started.shtml
          hardcoded=$(grep -nE 'zcli v?[0-9]+\.[0-9]+\.[0-9]+' "$gs" || true)
          if [ -n "$hardcoded" ]; then
            echo "::error::hardcoded zcli version in $gs — inject it from site-data.json instead ($site.asset('site-data.json').ziggy().get('version')):"
            echo "$hardcoded"
            exit 1
          fi
          if ! grep -q "site-data.json" "$gs"; then
            echo "::error::$gs no longer reads site-data.json — did the transcript lose its version injection?"
            exit 1
          fi
          echo "$gs: no hardcoded versions; site-data.json injection present"

      # The one-line curl installer standardises on the branded zcli.sh host
      # (https://zcli.sh/install.sh) across README + every website layout. The
      # drift this catches is a stray raw.githubusercontent.com install URL —
      # the old form that slipped in on some pages. (The home page renders the
      # host without the scheme, and the getting-started demo terminal shows an
      # elided `…/install.sh` placeholder; both are the branded host, so we
      # simply forbid the wrong host rather than pin an exact string.)
      - name: Install URL uses the branded host, not raw.githubusercontent
        shell: bash
        run: |
          bad=$(grep -rnE 'raw\.githubusercontent\.com/[^ ]*install\.sh' README.md website/layouts || true)
          if [ -n "$bad" ]; then
            echo "::error::install URL drift — use https://zcli.sh/install.sh, not the raw GitHub URL. Offending lines:"
            echo "$bad"
            exit 1
          fi
          echo "No raw.githubusercontent.com install URLs — all install commands use the branded zcli.sh host"

  # Builds the actual website. Until this job existed, `zine release` ran in
  # exactly one place — deploy-docs.yml, on `release: published` — so a broken
  # page was first discovered AFTER a release had shipped, when it was already a
  # stale-website incident rather than a red check.
  #
  # That is not hypothetical: the v0.23.0 docs deploy died on
  # "content/changelog/index.smd:14:85: error: unknown page" (#805). The cause
  # was one CHANGELOG entry written as [ADR-0032](docs/adr/0032-….md) — a
  # repo-relative path that is not a website page. CHANGELOG.md is a *build
  # input* (sync-site-data.sh generates the changelog page from it), so ordinary
  # release-note prose can break the deploy, and every other ADR reference in
  # that file is plain text. Reproduced against this job's Zine before it was
  # written: exit 1 with the link, exit 0 without.
  #
  # Uses the same pinned, hash-verified Zine as the deploy, via the shared
  # composite action — see .github/actions/setup-zine for why that matters.
  website:
    name: website builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.website == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Zine
        uses: ./.github/actions/setup-zine

      # Regenerates assets/site-data.json and content/changelog/index.smd, both
      # gitignored. Hard-fails on an unreadable version, a zero plugin count, or
      # a CHANGELOG with no release headings.
      - name: Sync site data from build.zig.zon and CHANGELOG.md
        run: ./website/sync-site-data.sh

      # `zine release` runs the link checker that the deploy runs. It refuses to
      # build into a non-empty public/, which a fresh checkout never has.
      - name: Build site
        working-directory: website
        run: ./zine release

  # Zig 0.16's first-party fuzzer instruments source coverage itself, avoiding
  # the kcov/DWARF and matching-LLVM-runtime problems that previously blocked
  # coverage reporting here (#335). The ordinary `fuzz-smoke` run executes the
  # checked-in corpus deterministically; the second run lets the fuzzer mutate
  # Smith decisions for a fixed iteration budget. Its built-in report records
  # runs, unique runs, and covered/total instrumented PCs (including a
  # percentage) in the job summary and an artifact.
  #
  # This is reporting, not a percentage gate. The denominator is the whole
  # imported core test artifact and changes with Zig/codegen/source shape; no
  # evidence supports inventing a pass number. What is fail-closed is that the
  # fuzz targets run successfully and emit a coverage report at all.
  #
  # One Linux leg controls cost and matches the current toolchain constraint:
  # Zig 0.16 reports `--fuzz not yet implemented for windows`; parser semantics
  # still get deterministic corpus coverage on Windows through `zig build test`.
  parser-fuzz:
    name: parser fuzz + coverage report
    runs-on: ubuntu-latest
    # The clean coverage-instrumented Zig build is substantially slower than
    # ordinary compilation on GitHub's hosted x64 runners. Keep a hard ceiling,
    # but leave enough headroom for a cold build plus the bounded fuzz run.
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Run deterministic parser fuzz corpus
        run: zig build fuzz-smoke

      - name: Run bounded coverage-guided parser fuzzing
        shell: bash
        env:
          # A clean local cache makes "0 -> N" a per-run measurement instead
          # of silently accumulating coverage from setup-zig's shared cache.
          ZIG_LOCAL_CACHE_DIR: ${{ runner.temp }}/zcli-parser-fuzz-cache
        run: |
          set -o pipefail
          report="$RUNNER_TEMP/parser-fuzz-report.txt"
          # Keep the required gate on the fast coverage plateau. A 1K clean
          # Linux run covers essentially the same instrumented PCs as 5K.
          # The clean instrumented rebuild dominates hosted-runner time, so the
          # job has a separate bounded timeout above; sustained random fuzzing
          # belongs in a local/session run, not in the merge gate.
          zig build fuzz --fuzz=1K --summary all 2>&1 | tee "$report"
          if ! grep -q '^======= FUZZING REPORT =======$' "$report"; then
            echo "::error::Zig fuzzing completed without its objective coverage report"
            exit 1
          fi
          {
            echo '### Parser fuzz coverage'
            echo '```text'
            awk '/^======= FUZZING REPORT =======$/, /^==============================$/' "$report"
            echo '```'
            echo
            echo 'Reporting only: no coverage percentage threshold is enforced.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload fuzz coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parser-fuzz-coverage
          path: ${{ runner.temp }}/parser-fuzz-report.txt
          retention-days: 14
          if-no-files-found: error

  test:
    name: unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      # No CI runner (nor a typical dev box) ships fish, so the completion
      # suite's `fish --no-execute` validation had never once run — the fish
      # generator's only coverage was escaping unit tests. Install it on the
      # cheapest leg (Linux) so the real-shell branch actually exercises fish,
      # and set ZCLI_REQUIRE_FISH=1 so a missing binary here is a hard failure
      # rather than a silent per-shell skip (guarding against regression to
      # never-validated). Other OS legs leave the flag unset — fish stays
      # optional there.
      #
      # zsh joins it here for a plainer reason: /bin/zsh is standard on macOS but
      # is NOT guaranteed on the Ubuntu runner image, and the suite now demands
      # zsh on every POSIX leg (ZCLI_REQUIRE_ZSH below). Installing it makes that
      # demand true by construction instead of by hoping the image ships it.
      # bash needs no install step — /bin/bash is present on both POSIX images.
      - name: Install fish + zsh (Linux — enables the completion suite's fish/zsh branches)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fish zsh

      # Runs the test suites for every package (packages/*) AND projects/zcli's
      # own unit tests on all three OSes. Windows is a first-class leg now that
      # the interactive `testing` harness compiles there (ConPTY backend); the
      # terminal stack is libc-free, so this guards portability across the board.
      # Every GitHub-hosted runner image (ubuntu, macos, windows) ships pwsh,
      # so the completion suite's real-pwsh syntax check must actually run on
      # all three legs — ZCLI_REQUIRE_PWSH=1 turns a missing/unfound binary
      # into a hard failure rather than a silent skip (the same
      # guard-against-never-validated as fish above, without needing an
      # install step).
      #
      # ZCLI_REQUIRE_BASH / ZCLI_REQUIRE_ZSH close the last hole in that scheme
      # (#783): the completion suite drives real bash and zsh at a dozen sites,
      # every one of which used to degrade to a silent skip if the binary went
      # missing — the whole functional half could stop running and CI would still
      # be green. Both shells are present on the POSIX legs (bash ships with the
      # images; zsh is installed above on Linux), so demand them there. Windows
      # gets the empty string: `findShell` only probes POSIX absolute paths, so
      # neither shell is reachable on that leg and both stay optional.
      #
      # The `cond && '1' || ''` idiom is safe in THIS direction only — see the
      # installers job for why the reverse (empty string in the left branch)
      # silently evaluates to '1'.
      - name: Run tests
        env:
          ZCLI_REQUIRE_FISH: ${{ runner.os == 'Linux' && '1' || '' }}
          ZCLI_REQUIRE_PWSH: "1"
          ZCLI_REQUIRE_BASH: ${{ runner.os != 'Windows' && '1' || '' }}
          ZCLI_REQUIRE_ZSH: ${{ runner.os != 'Windows' && '1' || '' }}
        run: zig build test

  # install.sh and install.ps1 are the `curl | sh` / `irm | iex` trust root, and
  # they carry the only release-signature validation most users ever run — yet
  # no Zig test can reach them (there is no Zig involved). This job IS that
  # coverage: it mints a throwaway minisign keypair, signs fixtures under two
  # different tags, and asserts the installers reject a genuinely-signed OLDER
  # release replayed under a newer tag, along with prefix and case-only near
  # misses. Case matrix and rationale: scripts/test-install-signature.sh.
  #
  # Both harnesses run on Linux and macOS, where minisign is one package away.
  # Windows deliberately runs only the PowerShell one, and only the parts that
  # need no minisign: the registry value-kind contract that install.ps1's
  # %VAR%-preserving PATH handling rests on and that cannot be observed on any
  # other OS, plus the release-selection and TLS-floor sections, which are pure.
  # So no leg silently runs nothing, each sets a ZCLI_REQUIRE_* flag that turns
  # its own missing prerequisite into a hard failure.
  #
  # WHAT THE WINDOWS TICK DOES NOT MEAN. Everything gated on minisign is skipped
  # there, including the whole signature/version-binding matrix and the
  # hostile-`minisign`-function case that covers Test-Signature's tool
  # resolution (#772). That is the identical PowerShell exercised on the Linux
  # and macOS legs, so it IS covered — but by those two legs, not this one. A
  # green Windows run says nothing about it. Closing that gap means packaging
  # minisign for the Windows runner image; until then, do not read this leg as
  # coverage it does not provide.
  installers:
    name: installer signature binding (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.installers == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install minisign (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign

      - name: Install minisign (macOS)
        if: runner.os == 'macOS'
        run: brew install minisign

      # Run with `sh`, which is dash on the Linux runner: install.sh must stay
      # POSIX (it is piped straight into /bin/sh on user machines), so a bashism
      # in verify_signature fails this step as well as the assertions.
      - name: install.sh signature + version binding
        if: runner.os != 'Windows'
        env:
          ZCLI_REQUIRE_MINISIGN: "1"
        run: sh scripts/test-install-signature.sh

      - name: Release rerun, recovery dispatch, and waiter bounds
        if: runner.os != 'Windows'
        run: bash scripts/test-release-orchestration.sh

      # Invoked as a child process (not `shell: pwsh`) so the harness's exit
      # code is the step's, unambiguously. Every GitHub-hosted runner image
      # ships pwsh, so a missing interpreter fails the step outright.
      #
      # Split per-OS with `if:` rather than selecting the ZCLI_REQUIRE_* values
      # inside one step with a `${{ cond && 'a' || 'b' }}` expression. That
      # idiom is a trap when either branch is the empty string: '' is FALSY in
      # GitHub's expression language, so `runner.os == 'Windows' && '' || '1'`
      # evaluates to '1' on Windows — the `&&` yields '', then the `||` falls
      # through to the right operand. The harness treats any non-empty value as
      # "required" (`if ($env:ZCLI_REQUIRE_MINISIGN)`), so the Windows leg
      # demanded the very binary it was meant to skip. Two steps, each with a
      # literal value, cannot express that bug.
      - name: install.ps1 signature + version binding
        if: runner.os != 'Windows'
        env:
          ZCLI_REQUIRE_MINISIGN: "1"
        run: pwsh -NoProfile -File scripts/test-install-signature.ps1

      # Windows runs the same harness minus its signature section: minisign is
      # not packaged on the runner image, and the section it would gate is the
      # identical PowerShell exercised on the two legs above. Everything else —
      # registry contract, release selection, TLS floor — still runs here.
      - name: install.ps1 registry + PATH contract
        if: runner.os == 'Windows'
        env:
          ZCLI_REQUIRE_REGISTRY: "1"
        run: pwsh -NoProfile -File scripts/test-install-signature.ps1

  windows-release-build:
    name: windows release build
    runs-on: windows-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      # Build the CLI natively in ReleaseSafe — a real Windows toolchain catches
      # native linking/ABI + optimize-mode issues that the release's
      # cross-compile from Linux would not. This is the only ReleaseSafe Windows
      # coverage on PRs (release.yml cross-compiles and is tag-triggered). The
      # `test` job now runs the unit suites natively on Windows, and the `e2e`
      # job builds the binary (Debug) and exercises it end to end, so a separate
      # smoke step here would be redundant.
      - name: Build zcli (native Windows, ReleaseSafe)
        working-directory: projects/zcli
        run: zig build -Doptimize=ReleaseSafe -Dstrip=true

  # The release cross-compiles the static-musl Linux binaries (release.yml's
  # build job, only on tag push), so PR CI never once built musl — and a
  # musl-only build-graph panic in the secrets backend (fixed in 1931528)
  # blocked the 0.19.0 release with a break PR CI could not have caught. This
  # job closes that gap: it mirrors release.yml's build invocation EXACTLY
  # (same `cd projects/zcli` + `zig build -Doptimize=ReleaseSafe -Dstrip=true -Dtarget=…`
  # per musl target) so the two can't drift and reopen the hole. x86_64 is a
  # static binary the x64 runner can execute, so smoke-test it (mirrors the
  # release's Smoke test step); aarch64 is build-only (can't run here).
  linux-musl-release-build:
    name: linux musl release build (${{ matrix.zig_target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - zig_target: x86_64-linux-musl
            smoke: true # static musl binary runs on the x64 runner
          - zig_target: aarch64-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # mlugg/setup-zig already caches the global Zig cache dir (~/.cache/zig
      # on Linux; local caches are redirected into it) between runs by
      # default — no separate actions/cache step is needed here or on any
      # other job in this file. Its cache key includes the runner OS
      # automatically, but NOT matrix variables, and this is the one job in
      # this workflow whose matrix axis (zig_target) doesn't vary by OS: both
      # legs run on ubuntu-latest but cross-compile genuinely different
      # targets (x86_64 vs aarch64 musl). Without an explicit cache-key the
      # two legs would thrash a single shared cache entry. (test/secrets/e2e
      # matrix only on `os`, which is already disambiguated for free.)
      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          cache-key: ${{ matrix.zig_target }}

      # Byte-for-byte the release build command (release.yml → build job → Build
      # zcli). No test suite re-run — the `test` job already covers that; this
      # only guards that the release-mode musl cross-compile links and starts.
      - name: Build zcli (static musl, ReleaseSafe)
        working-directory: projects/zcli
        run: zig build -Doptimize=ReleaseSafe -Dstrip=true -Dtarget=${{ matrix.zig_target }}

      # Prove the artifact the release would publish actually starts, on the
      # target the runner can execute natively. Mirrors release.yml's smoke test.
      - name: Smoke test the binary
        if: matrix.smoke
        working-directory: projects/zcli
        run: |
          ./zig-out/bin/zcli --version
          ./zig-out/bin/zcli --help

  secrets:
    name: zcli_secrets backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.secrets == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      # The Linux backend shells out — it links nothing (ADR-0010) — so no dev
      # headers are needed. The live round-trip exercises BOTH runtime backends,
      # so install the tools for each: gnome-keyring + dbus + secret-tool for the
      # Secret Service path, and pass + gnupg for the pass path. macOS (Keychain)
      # and Windows (Credential Manager) need nothing installed.
      - name: Install secret backend tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gnome-keyring dbus libsecret-tools pass gnupg

      # Compile the host's native backend and run its unit tests. On Linux this
      # is now a pure compile (no library to link — ADR-0010); it does NOT touch
      # any real credential store.
      - name: Compile native backend
        working-directory: packages/core
        run: zig build test-secrets

      # Live round-trip against the real OS keychain (set / get / overwrite /
      # delete a throwaway entry). macOS Keychain and Windows Credential Manager
      # are available directly for the logged-in runner user.
      - name: Live round-trip (macOS Keychain / Windows Credential Manager)
        if: runner.os != 'Linux'
        working-directory: packages/core
        run: zig build test-secrets-live

      # On Linux both runtime backends are exercised, each forced explicitly via
      # ZCLI_SECRETS_BACKEND so the run is deterministic (and the override path is
      # covered too).
      #
      # Secret Service path: bring up a private session bus (dbus-run-session)
      # with an unlocked gnome-keyring registering org.freedesktop.secrets, so
      # `secret-tool` has a service. Recipe mirrors GNOME's own headless setup.
      - name: Live round-trip (Linux Secret Service via secret-tool)
        if: runner.os == 'Linux'
        working-directory: packages/core
        shell: bash
        run: |
          dbus-run-session -- bash -c '
            set -e
            echo "" | gnome-keyring-daemon --unlock --components=secrets
            # Wait until the secrets service owns its name on the bus; fail loudly
            # rather than run the test against a keyring that never came up.
            ready=
            for i in $(seq 1 30); do
              if dbus-send --session --dest=org.freedesktop.DBus \
                   --type=method_call --print-reply \
                   /org/freedesktop/DBus org.freedesktop.DBus.GetNameOwner \
                   string:org.freedesktop.secrets >/dev/null 2>&1; then
                echo "org.freedesktop.secrets ready after ${i}s"; ready=1; break
              fi
              sleep 1
            done
            [ -n "$ready" ] || { echo "ERROR: org.freedesktop.secrets never came up"; exit 1; }
            ZCLI_SECRETS_BACKEND=secret-service zig build test-secrets-live
          '

      # pass path: a throwaway, passphrase-less GPG key in an isolated GNUPGHOME
      # (loopback pinentry so nothing prompts), and an isolated password store.
      # No session bus is needed — this is the headless case pass exists to serve.
      - name: Live round-trip (Linux pass)
        if: runner.os == 'Linux'
        working-directory: packages/core
        shell: bash
        run: |
          set -e
          export GNUPGHOME="$(mktemp -d)"
          export PASSWORD_STORE_DIR="$(mktemp -d)"
          printf 'allow-loopback-pinentry\n' > "$GNUPGHOME/gpg-agent.conf"
          printf 'pinentry-mode loopback\n'  > "$GNUPGHOME/gpg.conf"
          gpg --batch --pinentry-mode loopback --passphrase '' \
            --quick-generate-key 'zcli CI <ci@zcli.invalid>' default default never
          pass init 'zcli CI <ci@zcli.invalid>'
          ZCLI_SECRETS_BACKEND=pass zig build test-secrets-live

  examples:
    name: canonical examples compile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.examples == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      # The `ghauth` and `oauth-device` examples opt into zcli_secrets, whose
      # Linux backend now shells out at runtime instead of linking libsecret
      # (ADR-0010) — so compiling the examples needs no dev headers on any
      # platform.
      #
      # The canonical example CLIs are the idiom source AND the drift-detector
      # (ADR-0004): compiling them here means a framework change that breaks the
      # documented idioms fails CI, rather than silently rotting the examples
      # (and the AI context sourced from them).
      #
      # This job only compiles (install-target) the examples — it deliberately
      # does NOT run their `zig build test` (#345's premise). That's not a gap:
      # the root `test_projects` loop in build.zig already runs `zig build
      # test` as a subprocess in every example directory (exercising each
      # command's `addCommandTests` blocks), and that loop feeds the root
      # `test` step, which is exactly what the `test` job below runs via
      # `zig build test` on all three OSes. Adding a second `zig build test`
      # here would just re-run the same work a second time on a fourth OS.
      - name: Build all example CLIs
        run: zig build build-examples

      # The zcli_docs generator (`zig build docs`, ADR-0030) is build-only: its
      # tool executable sits off the default install path by design, so NOTHING
      # in this workflow compiled it — 704 lines of shipped, README-advertised
      # feature code that CI neither built nor ran (#739). It worked; nothing
      # would have said the day it stopped.
      #
      # `examples/tasks` registers the plugin with two formats and has a nested
      # command group, so one invocation covers the index, per-command pages,
      # subdirectory creation and both writers. It rides in this job rather than
      # its own because the job already builds this exact project — the registry
      # compile is a cache hit — and it is already gated on the `examples`
      # filter, which covers packages/** (where the generator lives) as well as
      # the examples themselves.
      #
      # Exhaustive format assertions — including the markdown-`|`, roff-`\&` and
      # HTML-entity escaping, driven by a deliberately adversarial fixture
      # registry — live in the generator's unit tests
      # (packages/core/src/plugins/zcli_docs/tool.zig, under `zig build test`).
      # What this step adds is the real end-to-end path those cannot reach: a
      # real generated registry, a real tool binary, real files on disk.
      - name: Generate docs (type-checks + runs the zcli_docs build tool)
        working-directory: examples/tasks
        shell: bash
        run: |
          rm -rf docs
          zig build docs
          # Exiting 0 is not proof it produced anything, and existing is not
          # proof it produced anything USEFUL — so assert both. A docs step that
          # silently emits nothing (or a well-formed empty shell) is the same
          # class of failure as a test tier that silently skips, which is what
          # the ZCLI_REQUIRE_* flags elsewhere in this file exist to prevent.
          #
          # Each string pins one structural property a format regression would
          # break, chosen to assert SHAPE rather than inventory so that ordinary
          # additions to the tasks example don't churn this list:
          #   markdown index   - GFM table row + relative link to a nested page
          #   markdown page    - the shared `usage` synopsis convention, incl.
          #                      `[NAME]` bracketing for an optional positional
          #   html index       - the nested-page link the HTML index emits
          #   html nested page - the `../` breadcrumb depth maths, the easiest
          #                      thing here to get silently wrong
          fail=0
          check() { # check <file> <literal string>
            if [ ! -s "$1" ]; then
              echo "::error::zig build docs exited 0 but $1 is missing or empty"
              fail=1
            elif ! grep -qF -- "$2" "$1"; then
              echo "::error::$1 no longer contains: $2"
              fail=1
            fi
          }
          check docs/markdown/README.md        '| [`tasks sprint create`](sprint/create.md) |'
          check docs/markdown/sprint/create.md '    tasks sprint create [NAME]'
          check docs/html/index.html           'href="sprint/create.html"'
          check docs/html/sprint/create.html   '<a href="../index.html">'
          [ "$fail" -eq 0 ] || exit 1
          echo "docs generated: $(find docs -type f | wc -l) files across markdown + html"

  # The registry is one comptime fold sharing one branch-quota budget, and the
  # file that would need `@setEvalBranchQuota` — zcli_generated.zig — is
  # generated by the framework, so an app author who outgrows the budget has no
  # escape hatch: the build just fails, in framework or std source. That ceiling
  # sat at 28 top-level commands (#730) and nothing in CI could see it, because
  # every example and test project in this repo is far smaller. This job
  # compiles an app well past the target scale so the wall cannot silently come
  # back — a regression here is a build failure, not a slow degradation.
  #
  # 120 commands, not 100: the acceptance bar is 100, and a gate that sits
  # exactly at the bar tells you nothing about the headroom above it.
  #
  # Debug (the default optimize mode) on purpose — comptime evaluation is
  # identical in every mode, and Debug is by far the cheapest way to reach it.
  # One OS is enough: comptime quota accounting is target-independent.
  registry-scale:
    name: registry comptime scaling (120 commands)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Generate a 120-command app against this checkout
        run: scripts/gen-scale-project.sh 120 "$RUNNER_TEMP/zcli-scale"

      - name: Compile it
        working-directory: ${{ runner.temp }}/zcli-scale
        run: zig build

      # Compiling proves the quotas hold; running proves the registry the
      # quotas produced actually routes. `--help` walks the full command list
      # (the comptime-built command_info), and the last command exercises
      # routing past every earlier entry.
      - name: Run it
        working-directory: ${{ runner.temp }}/zcli-scale
        run: |
          ./zig-out/bin/scale --help
          ./zig-out/bin/scale cmd120 target --count 3
          ./zig-out/bin/scale c120 target --count 3   # the alias entry

  e2e:
    name: zcli end-to-end tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      # Runs the built zcli binary against throwaway temp projects, including a
      # tier that scaffolds a project and builds it against the local tree, and
      # an interactive tier that drives prompts through a real terminal.
      #
      # The interactive terminal harness runs on all three OSes: POSIX uses a PTY
      # (the harness has caught macOS-specific bugs: its 4 KiB PTY buffer,
      # EIO-on-close semantics), Windows uses a ConPTY. Every interactive tier —
      # including `zcli dev`'s watch/rebuild loop (nightwatch's ReadDirectoryChangesW
      # backend) — exercises the terminal stack on every platform.
      #
      # The interactive tests degrade to a skip — not a failure — where the
      # pseudo-terminal can't be allocated, so a green run could silently lose
      # that coverage. ZCLI_REQUIRE_INTERACTIVE=1 makes the harness hard-fail
      # instead of skip in that case, proving the tier actually ran on every OS.
      - name: Run e2e tests
        working-directory: projects/zcli
        shell: bash
        env:
          ZCLI_REQUIRE_INTERACTIVE: "1"
        run: zig build e2e

  # Performance budgets. `zig build regression` has two halves: packages/core's
  # parse micro-budgets (in-process, ReleaseFast) and projects/zcli's
  # startup-time + binary-size budgets, which build the CLI exactly as
  # release.yml does (ReleaseSafe + strip) and measure the artifact.
  #
  # This gate did not exist. Worse, `zig build benchmark` and `zig build
  # regression` had not COMPILED since the Zig 0.16 migration — the harness used
  # `std.heap.GeneralPurposeAllocator` and `std.time.Timer`, both gone in 0.16 —
  # and nothing noticed, because the harness was in no test aggregator and this
  # file mentioned neither step (#738). Its absence is what let a batch of
  # performance defects accumulate unseen. Two changes keep it honest: the
  # harness now rides into `zig build test` on all three OSes (so a compile
  # break fails a PR even if this job were removed), and this job runs the
  # budgets for real.
  #
  # One OS, deliberately. A budget is only meaningful against a reference
  # machine, and three sets of platform-specific numbers would be three times
  # the flake surface for no extra regression coverage — a slowdown in the
  # parser or in startup is not going to appear on macOS alone. Linux is the
  # cheapest runner and the platform the release's primary artifacts target.
  # Gated on `cli` because that filter is exactly the code these budgets
  # measure: all of packages/** plus projects/zcli/**.
  #
  # The budgets themselves (packages/core/src/benchmark.zig,
  # projects/zcli/test/budget.zig) carry their measured baselines, their exact
  # per-budget multiples, and the reasoning behind each. In short: the four
  # sub-0.1us parse budgets share a 2.0us absolute floor (~25-33x) because at
  # that scale the ceiling is set by measurement noise rather than by the work;
  # `parse_options` does ~7x the work and scales with it instead (~10x); and the
  # binary-size budget is the outlier in the other direction — size is
  # deterministic for a given Zig version/target/optimize mode, so it is the one
  # gate that can eventually be held near 2x. It starts slack on purpose: the
  # baseline was taken on macOS arm64 and this job enforces it on x86_64 Linux,
  # so it wants tightening once a few green runs print the real Linux figure.
  # Loose enough not to flake, tight enough to catch the order-of-magnitude
  # regressions worth gating — a flaky perf gate gets disabled, and a disabled
  # gate is worth less than none.
  perf:
    name: performance budgets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      # Fail-closed by construction: every budget is asserted unconditionally,
      # with no "binary not found, skipping" path and no environment flag that
      # softens it — the same principle as the ZCLI_REQUIRE_* variables above,
      # applied where there is nothing optional left to require.
      - name: Run performance regression budgets
        run: zig build regression

  # The single required status check for branch protection — the ruleset
  # requires ONLY this job (plus nothing else), never the per-job or per-leg
  # names. Two reasons:
  #
  #   1. Skipped MATRIX jobs break per-leg required checks: when a job with a
  #      strategy matrix is skipped by its job-level `if:`, GitHub never
  #      expands the matrix — it reports one skipped check run with the
  #      literal, un-substituted name (observed: "zcli_secrets backend
  #      (${{ matrix.os }})"), so required contexts like "zcli_secrets
  #      backend (ubuntu-latest)" are never created and sit at "Expected"
  #      forever. A gate that is itself never skipped sidesteps this.
  #   2. It fails when `changes` fails. Downstream jobs skipped because a
  #      needed job FAILED still read as satisfied to branch protection — so
  #      without this, a broken path filter could merge a PR with zero tests
  #      run. Here a failed `changes` surfaces as this job failing.
  #
  # `if: always()` so it reports even when everything upstream was skipped;
  # skipped is an acceptable result (that's the path-gating working as
  # designed), failure and cancellation are not. Adding or removing jobs or
  # matrix legs needs no ruleset edit — only membership in `needs` below.
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - changes
      - fmt
      - ruleset
      - version-sync
      - website
      - parser-fuzz
      - test
      - installers
      - windows-release-build
      - linux-musl-release-build
      - secrets
      - examples
      - registry-scale
      - e2e
      - perf
    steps:
      - name: Fail if any needed job failed or was cancelled
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")')
          if [ -n "$bad" ]; then
            echo "::error::jobs failed or were cancelled: $bad"
            exit 1
          fi
          echo "all jobs succeeded or were legitimately skipped"
