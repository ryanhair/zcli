name: Release

# Dispatch is the ONLY way to cut a release. Pick a version; CI bumps the
# manifests, stages the bump on a scratch branch, runs the full test + build
# gate against it, and only THEN commits to main and tags v<version> +
# zcli-v<version> (see `finalize`).
#
# There used to be a `push: tags` trigger as a manual fallback. It was removed
# (2026-07-29, ADR-0033) and should not come back:
#
#   - It needed the version bump merged to main by hand FIRST, which then made
#     dispatch unusable for that version (dispatch would try to bump again) —
#     so the fallback quietly became the path actually used.
#   - It let the tag point at a commit the CHANGELOG did not describe. That
#     happened for 0.23.0 and was caught by eye, not by a check.
#   - It skipped `finalize`, so no single job was present on both paths to
#     carry the approval gate — which is why all three publishing jobs had to
#     declare `environment: release`, costing two separate approvals per
#     release and, for 0.23.0, an 8-hour stall between a green build and the
#     draft being created.
#
# A failed dispatch is safe to simply re-run: nothing lands on main and no tag
# exists until `finalize`, so the version is still free.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version, semver only (e.g. 0.20.0). Bumps the manifests, tags, and publishes the CLI + library release."
        required: true
        type: string

# Only the jobs that publish get write access.
permissions:
  contents: read

# Release runs must not interleave: two dispatches in flight would otherwise
# race the main-branch push, tag creation, and draft/publish steps below. One
# queue for the whole workflow rather than per-ref, since every run shares the
# same ref (main) and would not otherwise be serialised.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Computes the version bump and stages it on a disposable branch (NOT main),
  # so the test/build gate below runs against real code without touching main
  # or creating tags yet. `finalize` promotes the staged commit to main and cuts
  # the real tags only after tests and the cross-target build succeed — see
  # #301.
  setup:
    name: Resolve release plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # This job runs BEFORE the `release` environment's required-reviewer gate
    # (which wraps `finalize` below) and holds contents: write to force-push
    # the `_release-staging/$VERSION` scratch branch (see the Plan step). This
    # is intentionally NOT gated: it is not a privilege escalation
    # (workflow_dispatch already requires repo write access to trigger),
    # $VERSION is strict-semver-validated before any interpolation, and the
    # write is confined to a disposable scratch branch — main and the real tags
    # are only ever touched by `finalize`, which IS gated. See #541.
    permissions:
      contents: write
    # `version` is the semver being cut; the two tags are derived from it at
    # each use site (v$version, zcli-v$version) rather than carried as separate
    # outputs that could disagree. `staging_branch` is both what the gate jobs
    # check out and what finalize deletes.
    outputs:
      version: ${{ steps.plan.outputs.version }}
      staging_branch: ${{ steps.plan.outputs.staging_branch }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Full history + tags so the dispatch path can detect an
          # already-used version and diff against main.
          fetch-depth: 0

      - name: Plan
        id: plan
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -eo pipefail
          VERSION="$INPUT_VERSION"
          # Strict semver, validated before any interpolation: this value is
          # later inlined into `run:` shell text and into git refs, both of
          # which would otherwise accept shell metacharacters. See #593.
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must be semver like 0.20.0 (got '$VERSION')"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/zcli-v$VERSION" >/dev/null \
            || git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::a tag for $VERSION already exists — pick a new version"
            exit 1
          fi

          # Bump the top-level .version field in every umbrella-versioned
          # manifest (packages/core tracks the umbrella; the other packages
          # free-float at 0.1.0 by design). The anchored 4-space indent avoids
          # the commented ".version" mention in the root manifest's
          # dependency notes.
          for f in build.zig.zon projects/zcli/build.zig.zon packages/core/build.zig.zon; do
            sed -i -E "s/^([[:space:]]*)\.version = \"[0-9]+\.[0-9]+\.[0-9]+\"/\1.version = \"$VERSION\"/" "$f"
            grep -q "\.version = \"$VERSION\"" "$f" || { echo "::error::failed to bump $f"; exit 1; }
          done

          # Keep the README Quick Start's pinned dependency tag on the
          # release being cut (the version-sync CI job enforces this).
          sed -i -E "s|(/zcli/archive/refs/tags/v)[0-9]+\.[0-9]+\.[0-9]+(\.tar\.gz)|\1$VERSION\2|" README.md
          grep -q "refs/tags/v$VERSION.tar.gz" README.md || { echo "::error::failed to bump README.md"; exit 1; }

          # Prose sweep (#386): a version bump must also update the sentences
          # ABOUT the version, not just version strings. Promote the
          # CHANGELOG's Unreleased section (no-op if already promoted), stamp
          # the ROADMAP's current-release line and fetch URL, and fail the
          # release if "unreleased" prose survives where it shouldn't.
          DATE="$(date -u +%Y-%m-%d)"
          sed -i -E "s/^## Unreleased$/## v$VERSION — $DATE/" CHANGELOG.md
          sed -i -E "s|(/zcli/archive/refs/tags/v)[0-9]+\.[0-9]+\.[0-9]+(\.tar\.gz)|\1$VERSION\2|" ROADMAP.md
          sed -i -E "s/^(Current release: \*\*v)[0-9]+\.[0-9]+\.[0-9]+(\*\*)/\1$VERSION\2/" ROADMAP.md
          grep -q "^## v$VERSION" CHANGELOG.md || { echo "::error::CHANGELOG.md has no v$VERSION section — add one (or an Unreleased section to promote)"; exit 1; }
          if grep -qi "unreleased" README.md; then
            echo "::error::README.md still says 'unreleased' — sweep the prose before releasing"
            exit 1
          fi
          # (The website changelog page is generated from CHANGELOG.md by
          # sync-site-data.sh, and ci.yml's `website` job builds it on every PR
          # that touches CHANGELOG.md, so it needs no sweep here.)

          # The same checked-in policy CI runs: prove every release metadata
          # surface now names the requested version before committing or
          # staging anything. The build jobs below add the executable check.
          scripts/validate-version.sh --expected "$VERSION"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Bump version to $VERSION"

          # Stage the bump on a disposable branch instead of main. Nothing
          # lands on main and no tag exists until `finalize` promotes this
          # exact commit after tests (and the cross-target build) pass —
          # a failed run leaves main and the tag namespace untouched, so a
          # re-dispatch of the same version just works. Force-push in case
          # a previous failed attempt left a stale staging branch behind.
          STAGING_BRANCH="_release-staging/$VERSION"
          git push --force origin "HEAD:refs/heads/$STAGING_BRANCH"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "staging_branch=$STAGING_BRANCH" >> "$GITHUB_OUTPUT"

  # The staged bump must pass the same unit + e2e coverage CI runs before any
  # of it reaches main or a tag. A bad bump must fail here, not ship.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: setup
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.setup.outputs.staging_branch }}

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Run unit tests
        shell: bash
        run: zig build test

      # Mirror ci.yml's e2e gate, guard included: the interactive tier degrades
      # to a skip (not a failure) where a pseudo-terminal can't be allocated, so
      # ZCLI_REQUIRE_INTERACTIVE=1 makes the harness hard-fail instead — a
      # release must not ship with that coverage silently dropped on any OS.
      - name: Run e2e tests
        working-directory: projects/zcli
        shell: bash
        env:
          ZCLI_REQUIRE_INTERACTIVE: "1"
        run: zig build e2e

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: [setup, test]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
            zig_target: x86_64-linux-musl
            smoke: true # static musl binary runs on the x64 runner
          - os: ubuntu-latest
            target: aarch64-linux
            zig_target: aarch64-linux-musl
            # Not smoke-tested: emulating aarch64 on the x64 runner needs
            # qemu-user-static. See #334 — accepted gap, documented in
            # docs/RELEASE-SIGNING.md.
          - os: macos-latest
            target: x86_64-macos
            zig_target: x86_64-macos
            smoke: true # macos-latest runners are arm64; run via Rosetta 2
            rosetta: true
          - os: macos-latest
            target: aarch64-macos
            zig_target: aarch64-macos
            smoke: true # macos-latest runners are arm64
          - os: ubuntu-latest
            target: x86_64-windows
            zig_target: x86_64-windows
            # Not smoke-tested: would need Wine on the Linux runner. See
            # #334 — accepted gap, documented in docs/RELEASE-SIGNING.md.
          - os: ubuntu-latest
            target: aarch64-windows
            zig_target: aarch64-windows
            # Not smoke-tested: same as x86_64-windows, plus Wine has no
            # aarch64 Windows emulation story. See #334.

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.setup.outputs.staging_branch }}

      # mlugg/setup-zig's cache key includes the runner OS automatically but
      # NOT matrix variables. Three of these six legs share os: ubuntu-latest
      # while cross-compiling genuinely different zig_target values, so an
      # explicit cache-key is required or those legs would thrash a single
      # shared cache entry. Mirrors ci.yml's linux-musl-release-build job,
      # which documents the identical hazard for its own ubuntu-latest matrix.
      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          cache-key: ${{ matrix.zig_target }}

      - name: Build zcli
        run: |
          cd projects/zcli
          zig build -Doptimize=ReleaseSafe -Dstrip=true -Dtarget=${{ matrix.zig_target }}

      - name: Package binary
        shell: bash
        run: |
          cd projects/zcli
          mkdir -p dist
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            cp zig-out/bin/zcli.exe dist/zcli-${{ matrix.target }}.exe
          else
            cp zig-out/bin/zcli dist/zcli-${{ matrix.target }}
            chmod +x dist/zcli-${{ matrix.target }}
          fi

      # aarch64-macos runs natively on the macos-latest (arm64) runner;
      # x86_64-macos needs Rosetta 2 installed first to run under emulation.
      - name: Install Rosetta 2
        if: matrix.rosetta
        run: softwareupdate --install-rosetta --agree-to-license

      # Prove the artifact we're about to publish actually starts, on the
      # targets the runner can execute (natively or via Rosetta). Mirrors
      # ci.yml's Windows smoke test. The remaining cross-compiled targets
      # (aarch64-linux, both Windows targets) are validated for linking only
      # — see #334 for the accepted-gap rationale.
      - name: Smoke test the binary
        if: matrix.smoke
        working-directory: projects/zcli
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          ../../scripts/validate-version.sh \
            --root ../.. \
            --expected "$VERSION" \
            --tag "zcli-v$VERSION" \
            --cli "./dist/zcli-${{ matrix.target }}"
          ./dist/zcli-${{ matrix.target }} --help

      - name: Generate checksum
        shell: bash
        run: |
          cd projects/zcli/dist
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            shasum -a 256 zcli-${{ matrix.target }}.exe > zcli-${{ matrix.target }}.exe.sha256
          else
            shasum -a 256 zcli-${{ matrix.target }} > zcli-${{ matrix.target }}.sha256
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zcli-${{ matrix.target }}
          path: projects/zcli/dist/zcli-${{ matrix.target }}*

  # Promotes the staged version-bump commit to main and cuts the real tags —
  # but only for the workflow_dispatch path, and only once tests (and the
  # full cross-target build, transitively via `needs: build`) have passed.
  # THE approval gate, and the only one (#292, ADR-0033). A required reviewer
  # must approve the `release` environment before this job runs.
  #
  # One gate, here, because this is the point of no return: everything before it
  # is disposable (a scratch branch), and everything after it is a consequence of
  # the tags this job cuts. `release` publishes a DRAFT — not public, so gating
  # it bought nothing and cost 0.23.0 an 8-hour stall — and `library-release`
  # does publish for real but cannot run without the tag created here, so this
  # approval already dominates it. Three gated jobs was an artifact of the old
  # `push: tags` trigger, which skipped this job and so left no single always-
  # present place to gate; with that trigger gone, this is that place.
  #
  # Positioned after test + build so the click lands when there is actually
  # something to approve: a green cross-platform build of the staged bump.
  finalize:
    name: Promote staged release to main
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [setup, build]
    environment: release
    permissions:
      contents: write
    steps:
      # Environment gating is a repo-settings fact this YAML cannot see: if
      # the `release` environment loses its required-reviewers rule, the
      # gate is silently inert (the 0.20.0 release proved it, #397). An
      # unprotected environment starts the job immediately, and this step then
      # refuses to proceed. Fail-closed: an unreadable environment also fails.
      # Now that one job carries the gate, this assertion lives in one place —
      # it used to be copy-pasted into all three.
      - name: Assert the release environment is protected
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rules=$(gh api "repos/$GITHUB_REPOSITORY/environments/release" --jq '[.protection_rules[].type]') || {
            echo "::error::cannot read the 'release' environment — it must exist with a required-reviewers rule (Settings → Environments)"; exit 1; }
          echo "protection rules: $rules"
          echo "$rules" | grep -q required_reviewers || {
            echo "::error::the 'release' environment has NO required-reviewers rule — the approval gate is inert (#397); refusing to publish"; exit 1; }

      - name: Checkout staged commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.setup.outputs.staging_branch }}
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
          fetch-depth: 0

      - name: Push to main and cut tags
        shell: bash
        env:
          LIB_VERSION: ${{ needs.setup.outputs.version }}
          STAGING_BRANCH: ${{ needs.setup.outputs.staging_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -eo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The branch push is the ONLY operation that needs the deploy key:
          # main is protected by the Main Protection ruleset and the deploy key
          # is its bypass actor (`origin` is the SSH remote configured by the
          # checkout's ssh-key). See #721.
          #
          # This is a fast-forward push, so it fails if main moved after `setup`
          # staged the bump. That is the correct outcome — the staged tree would
          # not contain the newer commits — but it happens ~20 minutes and one
          # approval in, so say what it means rather than leaving a raw git
          # error. Nothing has been tagged or published at this point.
          if ! git push origin HEAD:main; then
            echo "::error::could not fast-forward main — it moved after this release was staged, so the staged tree is missing those commits. Nothing was tagged or published and the version is still free: re-run the release to restage on current main."
            exit 1
          fi

          # Push the tags via an HTTPS remote authenticated with GITHUB_TOKEN,
          # NOT the deploy key. Deploy-key pushes are outside GitHub's
          # GITHUB_TOKEN recursion guard, so they trigger workflows that a
          # token push would not. The `on: push: tags` trigger this used to
          # re-enter is gone (ADR-0033), so the original recursion is no longer
          # possible — but keep the token push: tags aren't ruleset-protected so
          # it costs nothing, and it means re-introducing any tag-triggered
          # workflow cannot silently resurrect the duplicate-run bug.
          # See #721 / #728.
          git tag "v$LIB_VERSION"
          git tag "zcli-v$LIB_VERSION"
          git remote add token-origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git push token-origin "v$LIB_VERSION" "zcli-v$LIB_VERSION"

          # Clean up the scratch branch now that main + the real tags carry
          # this commit. Best-effort: a failure here shouldn't fail the run.
          git push origin --delete "$STAGING_BRANCH" || true

  # No `environment:` and no `if:`. Both were needed only because the old
  # `push: tags` trigger could reach this job without `finalize` having run;
  # now `needs: finalize` means this cannot start unless the approved job cut
  # the tag, and plain `needs` already requires success. This job publishes a
  # DRAFT, so it is not the thing a gate would protect anyway — the CLI
  # release goes public only when a human signs it (ADR-0023).
  release:
    name: Create Release
    timeout-minutes: 15
    needs: [setup, build, finalize]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: zcli-v${{ needs.setup.outputs.version }}

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist

      - name: Flatten artifact structure
        shell: bash
        run: |
          mkdir -p release
          find dist -type f -name 'zcli-*' -exec cp {} release/ \;
          ls -la release/

      - name: Create checksums file
        shell: bash
        run: |
          cd release
          cat *.sha256 > checksums.txt
          rm *.sha256

      # Published as a DRAFT on purpose. The release is signed offline with a key
      # that never touches CI (ADR-0023): `scripts/release.sh` — which is what
      # dispatched this run — signs checksums.txt, uploads checksums.txt.minisig
      # and flips the release to published. Drafting until signed means
      # fail-closed clients never see an unsigned release. See
      # docs/RELEASE-SIGNING.md.
      - name: Create Release (draft — sign locally to publish)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: zcli-v${{ needs.setup.outputs.version }}
          files: release/*
          generate_release_notes: true
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Only reached if someone dispatched this workflow by hand instead of
      # running scripts/release.sh, which signs and publishes on its own.
      - name: Signing reminder
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          echo "::notice title=Sign this release::CLI release zcli-v$VERSION is a DRAFT and nobody can install it yet. Run 'scripts/release.sh $VERSION' locally to sign, publish, deploy the docs and verify the site. See docs/RELEASE-SIGNING.md."

  # Unlike the CLI release this publishes immediately — there is no signing
  # ceremony for a source tarball consumed by `zig fetch`, whose integrity comes
  # from the hash in the consumer's build.zig.zon. It is therefore the one job
  # here that makes something public without a human in the loop, which is
  # exactly why `finalize` is gated: this cannot run unless a reviewer approved
  # the job that created the tag it publishes. `needs: finalize` transitively
  # covers test and build, so it need not name them.
  library-release:
    name: Create Library Release
    timeout-minutes: 15
    needs: [setup, finalize]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: v${{ needs.setup.outputs.version }}

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      # `zig fetch <url>` (no --save) fetches the tarball, computes its
      # package hash, and prints exactly that hash to stdout — the same
      # value a consumer would get pasting the URL into their own
      # build.zig.zon. Substituted into the release notes below instead of
      # a "go run zig fetch yourself" placeholder. See #336.
      - name: Compute package hash
        id: hash
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          LIB_VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -eo pipefail
          URL="https://github.com/$REPOSITORY/archive/refs/tags/v$LIB_VERSION.tar.gz"
          HASH="$(zig fetch "$URL" | tail -n1 | tr -d '[:space:]')"
          if [ -z "$HASH" ]; then
            echo "::error::zig fetch produced no hash for $URL"
            exit 1
          fi
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        run: |
          cat > release-notes.md << 'EOF'
          # zcli Framework v${{ needs.setup.outputs.version }}

          This is the zcli framework library release. Use this version in your `build.zig.zon`:

          ```zig
          .dependencies = .{
              .zcli = .{
                  .url = "https://github.com/${{ github.repository }}/archive/refs/tags/v${{ needs.setup.outputs.version }}.tar.gz",
                  .hash = "${{ steps.hash.outputs.hash }}",
              },
          },
          ```

          ## Installation

          Run `zig fetch --save <url>` to add this dependency to your project.

          ## What's Included

          - Core zcli framework
          - Build utilities for command generation
          - Built-in plugins (help, version, not-found, completions, config, secrets, github-upgrade)
          - All supporting packages (vterm, markdown, etc.)

          ## Getting Started

          Use the zcli CLI tool to scaffold a new project:

          ```bash
          # Download the zcli CLI from the latest zcli-v* release
          # Or build from source
          zcli init my-app
          cd my-app
          zig build
          ```

          For the zcli CLI tool binaries, see the zcli-v* releases.
          EOF

      - name: Create Library Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.setup.outputs.version }}
          body_path: release-notes.md
          name: zcli Framework v${{ needs.setup.outputs.version }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
